name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Opens (or updates) the "Version Packages" pull request. Merging that
      # PR makes this same step publish the new version to npm.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After a real npm publish, point website/ at the version that was
      # just released so its next deploy (triggered by the push below)
      # ships the new library instead of whatever was previously pinned.
      #
      # npm takes a moment to serve a version it has just accepted: asking for
      # "latest" two seconds after the publish got the previous release, and
      # 0.14.0 left the site on 0.13.0 with only a lockfile refresh. So the
      # step waits for the exact version changesets published, and fails —
      # rather than committing nothing — if npm never serves it.
      - name: Bump website's react-resource-view to the published version
        if: steps.changesets.outputs.published == 'true'
        working-directory: website
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(node -p 'JSON.parse(process.env.PUBLISHED_PACKAGES).find((p) => p.name === "react-resource-view")?.version ?? ""')
          if [ -z "$version" ]; then
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if npm view "react-resource-view@$version" version > /dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          pnpm add "react-resource-view@^$version"
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(website): bump react-resource-view to $version"
          git push
